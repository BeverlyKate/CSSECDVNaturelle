name: Test and Deploy to Render

on:
  push:
    branches:
      - feature-notification-improvements
      - feature-admin-change-status-reservation
      - develop
  workflow_dispatch:
  
jobs:

  backend-reservations-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/reservations.test.js

  backend-notifications-test:
    runs-on: ubuntu-latest
    needs: backend-reservations-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/notifications.test.js

  backend-accounts-test:
    runs-on: ubuntu-latest
    needs: backend-notifications-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/accounts.test.js
      
  deploy:
    runs-on: ubuntu-latest
    needs: backend-accounts-test

    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install

    - name: Deploy to production
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        

