name: Test and Deploy to Render

on:
  workflow_dispatch:
  push:
    branches:
      - develop
jobs:

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
            node-version: 20.10.0

      - name: Install dependencies
        run: npm install
    
      - name: Run test
        uses: cypress-io/github-action@v6
        with:
          start: npm install
          browser: chrome

  backend-reservations-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/reservations.test.js

  backend-notifications-test:
    runs-on: ubuntu-latest
    needs: backend-reservations-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/notifications.test.js

  backend-accounts-test:
    runs-on: ubuntu-latest
    needs: backend-notifications-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test scripts/accounts.test.js
      
  deploy-to-render:
    runs-on: ubuntu-latest
    needs: backend-accounts-test

    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: 20.10.0

    - name: Install dependencies
      run: npm install

    - name: Deploy to production
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        

